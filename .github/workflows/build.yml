name: Build & Verify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Publish even if version.txt unchanged"
        type: boolean
        default: false
      loaders:
        description: "Loaders to publish (comma-separated: fabric,forge,neoforge,quilt). Empty = all"
        type: string
        default: ""
      mc_versions:
        description: "MC versions to publish (comma-separated: 1.21.11,26.1,26.1.1,26.1.2,26.2,26.3). Empty = all"
        type: string
        default: ""
      runtime_sp:
        description: "Run singleplayer (client) runtime test. Needs GPU-capable runner; GitHub-hosted runners are GPU-less, so default is skip (false)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jeder Job bekommt nur was er braucht (Publish-Job weiter unten: contents:write).
permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write  # upload-artifact
    outputs:
      changed: ${{ steps.version_check.outputs.changed }}
      version: ${{ steps.version_check.outputs.version }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false  # kein Push aus diesem Job: Token nicht im Git-Config ablegen

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Save Java 21 Home
        shell: pwsh
        run: echo "JAVA_21_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Save Java 25 Home
        shell: pwsh
        run: echo "JAVA_25_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Detect version change
        id: version_check
        shell: pwsh
        run: |
          $old = git show HEAD~1:version.txt 2>$null
          $new = (Get-Content version.txt -Raw).Trim()
          $force = "${{ github.event.inputs.force_publish }}" -eq "true"
          $changed = $old -ne $new
          echo "version=$new" >> $env:GITHUB_OUTPUT
          if ($changed -or $force) {
            echo "changed=true" >> $env:GITHUB_OUTPUT
            if ($force) { echo "Force publish: publishing enabled" }
            else { echo "Version changed ($old → $new): publishing enabled" }
          } else {
            echo "changed=false" >> $env:GITHUB_OUTPUT
            echo "Version unchanged: build+verify only"
          }

      - name: Verify Java homes
        shell: pwsh
        run: |
          Write-Host "JAVA_21_HOME=$env:JAVA_21_HOME"
          Write-Host "JAVA_25_HOME=$env:JAVA_25_HOME"
          if (-not (Test-Path "$env:JAVA_21_HOME")) { throw "Java 21 home not found: $env:JAVA_21_HOME" }
          if (-not (Test-Path "$env:JAVA_25_HOME")) { throw "Java 25 home not found: $env:JAVA_25_HOME" }

      - name: Build all versions
        shell: pwsh
        run: .\scripts\local\build-multiversion.ps1 -Loaders fabric,forge,neoforge,quilt -ContinueOnError:$false -UseIsolatedGradleHome:$false -FabricJavaHome "$env:JAVA_21_HOME" -FabricJava25Home "$env:JAVA_25_HOME"

      - name: Print build report
        shell: pwsh
        run: Get-Content dist/multiversion/build-report.md -Raw | Write-Host

      # A4: Release-JARs werden vor Verify/Runtime/Publish obfuskiert. Die CI baut
      # aus dem Quellcode; ohne diesen Schritt wuerden unobfuskierte JARs
      # veroeffentlicht. Die Backup-Kopie liegt ausserhalb von dist, damit sie
      # beim naechsten Lauf nicht als zusaetzliches Release-JAR zaehlt.
      - name: Fetch ProGuard toolchain
        shell: pwsh
        run: .\scripts\ci\fetch-proguard.ps1 -TargetDir "$env:RUNNER_TEMP\proguard"

      - name: Obfuscate release JARs (A4)
        shell: pwsh
        run: |
          $pg = "$env:RUNNER_TEMP\proguard"
          .\scripts\local\obfuscate-release.ps1 `
            -InputDir dist/multiversion `
            -BackupDir "$env:RUNNER_TEMP\a4-backup" `
            -ProguardJar "$pg\proguard-base-7.10.0.jar" `
            -ProguardCoreJar "$pg\proguard-core-9.4.0.jar" `
            -ProguardDependencyDir $pg `
            -AsmDir "$pg\asm"

      # Echtheitsnachweis: jedes Release-JAR bekommt ein signiertes Manifest
      # (Ed25519). Muss NACH dem Obfuskieren laufen (die Hashes decken den
      # ausgelieferten Bytecode ab) und VOR verify-jars.ps1 (das prueft die
      # Signatur mit). Der Private Key liegt nur im GitHub-Secret.
      - name: Setup Node (attest)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sign release JARs (attest)
        shell: pwsh
        env:
          STATUSMOD_ATTEST_KEY: ${{ secrets.STATUSMOD_ATTEST_KEY }}
        run: |
          if (-not $env:STATUSMOD_ATTEST_KEY) { throw "STATUSMOD_ATTEST_KEY secret is not set" }
          node scripts/ci/sign-build.mjs --dir dist/multiversion

      - name: Verify JARs
        shell: pwsh
        run: .\scripts\ci\verify-jars.ps1 -RequireAttest

      # Release-Gate: jedes signierte JAR muss in der Registry stehen, bevor es
      # hochgeladen/veroeffentlicht wird. Scheitert der Schritt, bricht der Job
      # ab - ein Build, dessen ID der Mod beim Start nicht findet, wird so nie
      # veroeffentlicht. Idempotent: ein erneuter Lauf ueberschreibt die Zeile.
      - name: Register builds (Supabase)
        shell: pwsh
        env:
          STATUSMOD_BUILD_TOKEN: ${{ secrets.STATUSMOD_BUILD_TOKEN }}
        run: |
          if (-not $env:STATUSMOD_BUILD_TOKEN) { throw "STATUSMOD_BUILD_TOKEN secret is not set" }
          node scripts/ci/register-builds.mjs --dir dist/multiversion

      - name: Upload JARs
        uses: actions/upload-artifact@v5
        with:
          name: statusmod-jars
          path: dist/multiversion/**/*.jar

      - name: Upload build report
        uses: actions/upload-artifact@v5
        with:
          name: build-report
          path: dist/multiversion/build-report.*

  matrix-prep:
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # download-artifact
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: statusmod-jars
          path: jars

      - name: Build runtime-test matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          find jars -name '*.jar' ! -name '*-sources.jar' | sort | while read -r f; do
            base=$(basename "$f")
            stem=${base%.jar}
            stem=${stem#Statusmod-}
            mc=${stem##*-}
            rest=${stem%-*}
            loader=${rest##*-}
            ver=${rest%-*}
            printf '%s|%s|%s|%s\n' "$base" "$loader" "$mc" "$ver"
          done > rows.txt
          cat rows.txt
          jq -R -s -c '
            split("\n") |
            map(select(length > 0) | split("|") | {jar: .[0], loader: .[1], mc: .[2], ver: .[3]}) |
            {include: .}
          ' rows.txt > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"

  runtime-test:
    needs: matrix-prep
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read  # download-artifact
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: actions/download-artifact@v5
        with:
          name: statusmod-jars
          path: dist/multiversion

      - name: Run runtime test
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path dist/multiversion -Recurse -Filter "${{ matrix.jar }}" -File | Select-Object -First 1
          if (-not $jar) { throw "JAR not found: ${{ matrix.jar }}" }
          Write-Host "Runtime-testing $($jar.FullName)"
          # Push-Events haben keine Inputs (""), GPU-lose Runner können SP nicht:
          # SP nur bei explizitem runtime_sp=true (Dispatch-Default), sonst MP-only.
          $skipSp = "${{ inputs.runtime_sp }}" -ne "true"
          & .\scripts\ci\test-runtime.ps1 -JarPath $jar.FullName -Loader "${{ matrix.loader }}" -McVersion "${{ matrix.mc }}" -JavaHome "$env:JAVA_HOME" -WorkDir "${{ runner.temp }}\rt" -SkipSinglePlayer:$skipSp

      - name: Upload runtime logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: runtime-${{ matrix.loader }}-${{ matrix.mc }}
          path: ${{ runner.temp }}/rt

  publish:
    needs: [build-and-verify, runtime-test]
    if: needs.build-and-verify.outputs.changed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write  # Tags + Release erzeugen
      actions: read  # download-artifact
    steps:
      - uses: actions/checkout@v5  # Credentials bleiben: Job pusht Tag
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: statusmod-jars
          path: dist/multiversion

      - name: Publish to Modrinth & CurseForge
        shell: pwsh
        run: .\scripts\ci\publish-all.ps1 -Loaders "${{ github.event.inputs.loaders }}" -McVersions "${{ github.event.inputs.mc_versions }}"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ needs.build-and-verify.outputs.version }}"
          $tag = "v$ver"
          $lastTag = git describe --tags --abbrev=0 2>$null
          $changelogFile = "$env:RUNNER_TEMP\changelog.md"
          # Kuratierter CHANGELOG.md-Abschnitt zuerst, Fallback git-log.
          $changelog = ""
          if (Test-Path -LiteralPath "CHANGELOG.md") {
            $clText = Get-Content -LiteralPath "CHANGELOG.md" -Raw
            $cm = [regex]::Match($clText, "(?ms)^## " + [regex]::Escape($ver) + "\b.*?\r?\n([\s\S]*?)(?=^## |\z)")
            if ($cm.Success) { $changelog = "# Status Player $ver`n`n" + $cm.Groups[1].Value.Trim() + "`n" }
          }
          if ([string]::IsNullOrWhiteSpace($changelog)) {
            $changelog = if ($lastTag) {
              $lines = git log "$lastTag..HEAD" --oneline 2>$null
              if ($lines) { "Changes since $lastTag`n`n$($lines -join "`n")" } else { "" }
            } else {
              $lines = git log --oneline -20 2>$null
              if ($lines) { "Changes`n`n$($lines -join "`n")" } else { "" }
            }
          }
          if ([string]::IsNullOrWhiteSpace($changelog)) { $changelog = "No changelog available" }
          Set-Content -Path $changelogFile -Value $changelog

          $tagExists = git tag -l "$tag" 2>$null
          if ($tagExists) {
            Write-Host "Tag $tag exists — deleting to recreate"
            git tag -d $tag
          }

          git tag $tag
          git push origin $tag

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists — deleting to recreate"
            gh release delete $tag --yes
          }
          # Dateien explizit aufzählen: ** wird an native Befehle nicht
          # rekursiv expandiert (fabric-JARs liegen eine Ebene tiefer).
          $assetFiles = @(Get-ChildItem -Path dist/multiversion -Recurse -Filter *.jar -File | ForEach-Object { $_.FullName })
          if ($assetFiles.Count -eq 0) { throw "No JARs found for release $tag" }
          # Prüfsummen: beweist, dass Release-Assets == CI-gebaute JARs sind.
          $sumsFile = Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt"
          $assetFiles | Sort-Object | ForEach-Object {
            $h = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $(Split-Path $_ -Leaf)"
          } | Set-Content -LiteralPath $sumsFile
          gh release create $tag `
            --title "Status Player $ver" `
            --notes-file $changelogFile `
            $assetFiles $sumsFile
